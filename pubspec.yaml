name: flutter_app_aethervault
description: "Aethervault - track MTG decks and collection."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  google_fonts: ^8.2.0
  http: ^1.1.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  archive: ^4.0.9
  multi_split_view: ^3.6.2
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  cached_network_image: ^3.4.1
  meta: ^1.17.0
  go_router: ^17.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - lib/l10n/
    # compact scryfall asset removed
